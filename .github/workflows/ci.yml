name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref}}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rust_catalog_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rust_catalog_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt,clippy --no-self-update

      - name: Check formatting
        run: cargo +1.94.1 fmt --all -- --check

      - name: Run clippy
        run: cargo +1.94.1 clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo +1.94.1 test --locked

      - name: Build Docker image
        run: docker build --tag rust-catalog-api:ci .
