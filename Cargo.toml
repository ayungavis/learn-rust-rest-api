[package]
name = "rust-catalog-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
aws-config = { version = "1.10.1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1.140.0", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
  "rustls",
] }
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.0"
dotenvy = "0.15.7"
lettre = { version = "0.11.22", default-features = false, features = [
  "builder",
  "smtp-transport",
  "pool",
  "tokio1",
  "tokio1-rustls",
  "ring",
  "rustls-native-certs",
] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-native-roots",
  "postgres",
  "migrate",
  "macros",
  "uuid",
  "time",
] }
thiserror = "2.0.19"
time = { version = "0.3.54", features = ["serde-well-known"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = { version = "0.5.3", features = ["timeout", "util"] }
tower-http = { version = "0.7.0", features = ["request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v7"] }

[dev-dependencies]
http-body-util = "0.1.4"
serde_json = "1.0.151"
